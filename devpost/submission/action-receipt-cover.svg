<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Action Receipt: reviewed actions with the original words attached</title>
<desc id="desc">Original project illustration, not an app screenshot. A source notice leads to a reviewed checklist while an unclear date remains unresolved.</desc>
<rect width="1200" height="800" fill="#f6f5ef"/>
<rect x="64" y="60" width="58" height="58" rx="15" fill="#245846"/>
<g transform="translate(70 63) scale(1.15)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M12 9h16v23l-3-2-3 2-3-2-3 2-4-2z"/><path d="m16 18 3 3 6-7M16 26h8" stroke-linecap="round"/></g>
<text x="140" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="bold" fill="#24382e">Action Receipt<tspan fill="#245846">.</tspan></text>
<text x="66" y="214" font-family="DejaVu Serif,Georgia,serif" font-size="66" fill="#24382e">Know what is next.</text>
<text x="66" y="293" font-family="DejaVu Serif,Georgia,serif" font-style="italic" font-size="66" fill="#245846">Keep the proof.</text>
<text x="69" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#54644f">One notice. Exact sources. Your approval.</text>
<rect x="67" y="397" width="490" height="229" rx="17" fill="#fff" stroke="#d5ddcd" stroke-width="2"/>
<text x="93" y="437" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#667d59">ORIGINAL WORDS</text>
<rect x="89" y="459" width="441" height="65" rx="7" fill="#eef4df"/>
<text x="104" y="484" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#2b4b29">Register for the architecture trip</text>
<text x="104" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#2b4b29">by Nov. 5, 2032.</text>
<text x="94" y="555" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#735c2e">Email the coordinator by next Friday.</text>
<text x="94" y="591" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#77816c">Illustrated excerpts from an invented notice.</text>
<path d="M581 509h45m-12-12 12 12-12 12" fill="none" stroke="#779065" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="650" y="397" width="483" height="229" rx="17" fill="#fff" stroke="#d5ddcd" stroke-width="2"/>
<text x="677" y="437" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#667d59">REVIEWED ACTIONS</text>
<rect x="677" y="471" width="23" height="23" rx="5" fill="#245846"/><path d="m682 482 5 5 9-10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="715" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#294a32">Register for the trip</text>
<text x="715" y="524" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#667d59">Check the source, then confirm the date.</text>
<rect x="677" y="550" width="429" height="49" rx="8" fill="#fbf1dd"/>
<text x="693" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#815b1f">“Next Friday” stays unresolved.</text>
<path d="M68 673h1064" stroke="#d7ddcf"/>
<text x="69" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245846">Offline browser app</text>
<text x="363" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245846">No API credits</text>
<text x="608" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#245846">Approved exports</text>
<text x="69" y="757" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#7b8571">PROJECT ILLUSTRATION · NOT AN APP SCREENSHOT</text>
</svg>
